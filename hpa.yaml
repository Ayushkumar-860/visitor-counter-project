# ═══════════════════════════════════════════════════════════════════════════════
# hpa.yaml — Horizontal Pod Autoscaler for Flask Deployment
# API: autoscaling/v2  (requires Metrics Server addon in Minikube)
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-hpa
  namespace: visitor-counter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # Scale out when avg CPU > 50% of request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # Wait 30s before scaling up further
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
